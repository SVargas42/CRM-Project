name: Validate desktop builds offline

# Actions has a networked control plane. Fully isolated builders invoke the same
# local script directly; no job step retrieves source, tools, packages or artifacts.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: offline-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-offline:
    name: Validate ${{ matrix.strPlatform }} from provisioned inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - strPlatform: macos-arm64
            arrRunnerLabels: [self-hosted, macOS, ARM64, hippocrm-offline-build]
          - strPlatform: windows-x64
            arrRunnerLabels: [self-hosted, Windows, X64, hippocrm-offline-build]
    runs-on: ${{ matrix.arrRunnerLabels }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_CERT_REVOCATION_MODE: offline
    steps:
      # Administrators provision this workspace/revision, PowerShell, the exact
      # approved SDK and LocalPackages offline. Missing inputs are fatal.
      - name: Validate and build with locked local dependencies
        run: |
          & ./scripts/InvokeOfflineBuild.ps1 -strConfiguration Release
